# Let overlayfs store its metadata on a tmpfs upper layer.
#
# volatile-binds (oe-core) mounts four overlays whose upperdir is on
# /var/volatile, i.e. tmpfs:
#
#   /var/lib   upper=/var/volatile/lib    work=/var/volatile/.lib-work
#   /var/cache upper=/var/volatile/cache  work=/var/volatile/.cache-work
#   /var/spool upper=/var/volatile/spool  work=/var/volatile/.spool-work
#   /srv       upper=/var/volatile/srv    work=/var/volatile/.srv-work
CONFIG_TMPFS_XATTR=y
