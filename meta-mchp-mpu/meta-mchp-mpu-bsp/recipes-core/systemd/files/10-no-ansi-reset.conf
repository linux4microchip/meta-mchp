# Keep systemd from writing ANSI/OSC sequences to the serial console.
#
# TTYReset=yes, upstream's default in serial-getty@.service, makes systemd
# reset the TTY before and after the getty runs. And prints below chars in the
# console
#   ESC[!p  ESC]104 ESC\  ESC[0m  ESC[?7h  ESC[1G  ESC[0J
[Service]
TTYReset=no
