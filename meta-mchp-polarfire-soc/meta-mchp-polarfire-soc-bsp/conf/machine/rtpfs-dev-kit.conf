#@TYPE: Machine
#@NAME: rtpfs-dev-kit
#@SOC: RT Polarfire SoC
#@DESCRIPTION: Machine configuration for the RT PolarFire SoC Dev Kit

require include/mpfs-common.inc

MACHINE_TYPE = "smp"

MACHINE_FEATURES:append = " pci usbgadget usbhost"

KERNEL_DTC_FLAGS += "-@"
KERNEL_DEVICETREE ?= "microchip/rtpfs-dev-kit.dtb"
FIT_CONF_PREFIX ?= "conf-microchip,"

UBOOT_MACHINE = "microchip_rtpfs_dev_kit_defconfig"

#INITRAMFS_IMAGE = "mchp-initramfs-image"

IMAGE_INSTALL:remove = " dt-overlay-mchp"

EXTERNAL_KERNEL_DEVICETREE = ""

## Generate a boot.scr file which should be included
##  in the boot partition. It will try to load a kernel image from mmc
UBOOT_ENV = "boot"
UBOOT_ENV_SUFFIX = "scr"
UBOOT_ENV_SIZE = "0x2000"

HSS_PAYLOAD = "uboot"

IMAGE_BOOT_FILES ?= " \
    fitImage \
    boot.scr \
    uboot.env \
"

WKS_FILE ?= "mpfs-rootfs.wks"

MACHINEOVERRIDES .= ":mpfs"
